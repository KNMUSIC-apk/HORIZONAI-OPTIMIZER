
# ==========================================================
# HorizonAI Optimizer - config.yml
# Minecraft Paper / Purpur 1.21.x
# ==========================================================

language: vi

# ==========================================================
# MONITORING
# ==========================================================

monitoring:
  # Chu kỳ lấy mẫu TPS/MSPT/RAM (tick). 20 tick = 1 giây.
  sample-interval-ticks: 40

  # Số mẫu lưu trong lịch sử hiệu suất.
  history-size: 720

  # Ngưỡng MSPT (ms).
  mspt-warning: 45.0
  mspt-critical: 60.0

  # Ngưỡng tăng MSPT so với baseline.
  lag-spike-delta: 15.0


# ==========================================================
# AI CONFIGURATION
# ==========================================================

ai:
  enabled: true

  # Provider: openai hoặc openai-compatible
  provider: openai

  # Model AI
  model: gpt-4o-mini

  # OpenAI Chat Completions endpoint
  endpoint: https://api.openai.com/v1/chat/completions

  # --------------------------------------------------------
  # API KEY CONFIGURATION
  # --------------------------------------------------------

  # Ưu tiên đọc API Key từ Environment Variable.
  api-key-env: HORIZONAI_AI_KEY

  # API Key dự phòng nếu hosting không hỗ trợ Environment Variables.
  # Chỉ nhập key thật trong config.yml trên server.
  # Không commit key thật lên GitHub.
  api-key: ""

  # --------------------------------------------------------
  # REQUEST SETTINGS
  # --------------------------------------------------------

  # Khoảng cách giữa hai lần phân tích AI (giây).
  analysis-interval-seconds: 300

  # Giới hạn request mỗi giờ.
  max-requests-per-hour: 12

  # Timeout request (giây).
  timeout-seconds: 20

  # Số lần retry khi request thất bại.
  max-retries: 2

  # --------------------------------------------------------
  # CIRCUIT BREAKER
  # --------------------------------------------------------

  circuit-breaker-failure-threshold: 3
  circuit-breaker-open-seconds: 300

  # Ngôn ngữ báo cáo AI.
  report-language: vi


# ==========================================================
# REDSTONE ANALYZER
# ==========================================================

redstone:
  detection-threshold-events-per-window: 400
  window-seconds: 10
  cluster-distance: 2

  max-analyzed-blocks: 2048
  max-tracked-machines: 256

  shared-source-margin: 6

  # Điều kiện tương quan MSPT.
  min-mspt-correlation-delta: 5.0
  min-correlation: 0.5
  min-samples: 12

  warnings-before-isolation: 2

  # Không tự động cách ly.
  auto-isolate: false

  isolation-delay-seconds: 60
  boundary-scan-radius: 24

  clock-min-frequency-hz: 2.0
  clock-max-interval-cv: 0.25

  warning:
    distance: 32
    cooldown-seconds: 120
    prefer-activator: true


# ==========================================================
# ENTITY ANALYZER
# ==========================================================

entity:
  chunk-entity-warning: 120

  density-radius: 16
  density-warning: 80

  item-overflow-warning: 300

  mob-thresholds:
    ZOMBIE: 60
    SKELETON: 60
    VILLAGER: 40
    ZOMBIE_VILLAGER: 30

  # Không tự xóa entity.
  auto-remove-entities: false


# ==========================================================
# HOPPER ANALYZER
# ==========================================================

hopper:
  chunk-hopper-warning: 200
  transfers-per-second-warning: 40


# ==========================================================
# CHUNK ANALYZER
# ==========================================================

chunk:
  analysis-enabled: true

  # Số chunk đánh giá mỗi chu kỳ.
  chunks-per-cycle: 16

  active-chunk-warning: 64


# ==========================================================
# OPTIMIZATION
# ==========================================================

optimization:
  # Chỉ đề xuất, không tự thay đổi cấu hình server.
  suggestions-only: true

  auto-whitelist-actions:
    - WARN_PLAYER
    - NOTIFY_ADMIN

  admin-approval-actions:
    - ISOLATE_MACHINE
    - RESTORE_MACHINE


# ==========================================================
# ADMIN ALERT
# ==========================================================

admin-alert:
  enabled: true
  min-level: HIGH
  cooldown-seconds: 600


# ==========================================================
# WHITELIST
# ==========================================================

whitelist:
  worlds: []

  # Định dạng:
  # world;minX;minY;minZ;maxX;maxY;maxZ
  regions: []

  # UUID hoặc tên người chơi.
  excluded-players: []


# ==========================================================
# LOGGING
# ==========================================================

logging:
  audit-enabled: true
  debug: false


# ==========================================================
# DATABASE
# ==========================================================

database:
  file: horizonai.db
  retention-days: 14
